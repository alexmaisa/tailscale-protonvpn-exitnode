services:
  wireguard:
    image: docker.io/qmcgaw/gluetun:latest
    container_name: wireguard # change if you need to
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./gluetun:/gluetun # container path
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn # or another vpn provider
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=xxx # input your wireguard private key
      - WIREGUARD_PUBLIC_KEY=xxx # input your wireguard public key
      - WIREGUARD_ADDRESSES=xxx.xxx.xxx.xxx/xx # input with your wireguard address
      - WIREGUARD_MTU=1320
      - SERVER_COUNTRIES=xxx # country name e.g. Switzerland
      - WIREGUARD_ALLOWED_IPS=0.0.0.0/0,::/6 # ipv4 and ipv6
      - VPN_PORT_FORWARDING=on # optional
      - BLOCK_ADS=on # optional
      - VPN_ACCELERATOR=on # optional
      - TZ=xxx # input your timezone e.g. Europe/Zurich
      - UPDATER_PERIOD=24h
      #- FIREWALL_OUTBOUND_SUBNETS=xxx.xxx.xxx.xxx/xx # optional, comment out to use local subnet with homelab services e.g. 192.168.1.0/24
  tailscale-wireguard:
    image: tailscale/tailscale:stable
    container_name: tailscale-wireguard # change if you need to
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - tsvarlib:/var/lib
      - tsstate:/state
      - /dev/net/tun:/dev/net/tun
    network_mode: "service:wireguard"
    restart: unless-stopped
    environment:
      - TS_HOSTNAME=xxx # named it as you wish
      - TS_AUTHKEY=tskey-client--xxx # it's better using trust credentials than auth key
      - TS_EXTRA_ARGS=--advertise-exit-node
      - TS_NO_LOGS_NO_SUPPORT=true
      - TS_STATE_DIR=/state
      - TS_AUTH_ONCE=true
      #- TS_ROUTES=xxx.xxx.xxx.xxx/xx # optional, comment out to use local subnet with homelab services e.g. 192.168.1.0/24, same as FIREWALL_OUTBOUND_SUBNETS

volumes:
  tsvarlib:
    driver: local
  tsstate:
    driver: local
